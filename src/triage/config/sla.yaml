# Service level targets by priority.
# clock: "24x7" counts every minute; "business" counts only service desk hours below.
# Change these to match your organisation's service level agreement (SLA).
timezone: Europe/London

business_hours:
  start: "08:00"
  end: "18:00"
  days: [mon, tue, wed, thu, fri]

priorities:
  P1:
    name: Critical
    respond_minutes: 15
    resolve_minutes: 240        # 4 hours, around the clock
    clock: 24x7
  P2:
    name: High
    respond_minutes: 30
    resolve_minutes: 480        # 8 business hours
    clock: business
  P3:
    name: Medium
    respond_minutes: 240        # 4 business hours
    resolve_minutes: 1800       # 3 business days of 10 hours
    clock: business
  P4:
    name: Low
    respond_minutes: 600        # 1 business day
    resolve_minutes: 3000       # 5 business days
    clock: business

# England and Wales bank holidays (source: https://www.gov.uk/bank-holidays).
# The service desk clock does not run on these days.
bank_holidays:
  - 2026-01-01
  - 2026-04-03
  - 2026-04-06
  - 2026-05-04
  - 2026-05-25
  - 2026-08-31
  - 2026-12-25
  - 2026-12-28
  - 2027-01-01
  - 2027-03-26
  - 2027-03-29
  - 2027-05-03
  - 2027-05-31
  - 2027-08-30
  - 2027-12-27
  - 2027-12-28
