name: Deploy

# Runs after CI passes on main, or by hand. It signs in to Azure with OpenID Connect: GitHub issues a
# short-lived token for this repository's "production" environment and Azure exchanges it for access
# as the deploy identity. No Azure password or key is stored in GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sql_location:
        description: Region to try first for a new Azure SQL server (an existing database never moves)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure
    # Skipped until the bootstrap script has been run and the repository variables are set.
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.outputs.outputs.app_url }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_RG: ${{ vars.APP_RESOURCE_GROUP }}
      TF_VAR_resource_group_name: ${{ vars.APP_RESOURCE_GROUP }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_enable_budget: ${{ vars.ENABLE_BUDGET || 'false' }}
      TF_VAR_enable_easy_auth: ${{ vars.ENABLE_EASY_AUTH || 'false' }}
      TF_VAR_enable_openai: ${{ vars.ENABLE_OPENAI || 'false' }}
      TF_VAR_analyst_object_ids: ${{ vars.ANALYST_OBJECT_IDS || '[]' }}
      TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}
    # Job defaults replace workflow defaults as a whole, so the shell is named here. Naming bash adds
    # -o pipefail, which the apply step needs: without it "terraform apply | tee" hides a failure.
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      # Right after the bootstrap script, Azure can take a few minutes to apply the deploy identity's
      # new permissions, so the first two steps retry.
      - name: Terraform init
        env:
          STATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          STATE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if terraform init -backend-config="resource_group_name=$STATE_RG" \
              -backend-config="storage_account_name=$STATE_ACCOUNT" -backend-config="container_name=tfstate" \
              -backend-config="key=ai-ticket-triage.tfstate" -backend-config="use_oidc=true" \
              -backend-config="use_azuread_auth=true"; then exit 0; fi
            echo "init failed (attempt $attempt), retrying in 30 seconds"
            sleep 30
          done
          exit 1

      # The app needs its image in the registry before it can be created, so the registry comes first.
      - name: Make sure the container registry exists
        run: |
          for attempt in 1 2 3 4; do
            if terraform apply -auto-approve -target=azurerm_container_registry.main \
              -target=azurerm_role_assignment.deployer_push; then exit 0; fi
            echo "apply failed (attempt $attempt), retrying in 30 seconds"
            sleep 30
          done
          exit 1

      - name: Build and push the image
        run: |
          REGISTRY=$(az acr list -g "$APP_RG" --query "[0].name" -o tsv)
          SERVER=$(az acr show -n "$REGISTRY" --query loginServer -o tsv)
          IMAGE="$SERVER/ai-ticket-triage:$COMMIT"
          docker build -t "$IMAGE" ../..
          # A new push permission can take a minute or two to reach the registry.
          for _ in 1 2 3 4 5 6 7 8; do
            if az acr login --name "$REGISTRY" && docker push "$IMAGE"; then exit 0; fi
            echo "push not allowed yet, retrying in 20 seconds"
            sleep 20
          done
          exit 1

      # Azure SQL does not accept new servers from every subscription type in every region (free
      # trials in most of the UK and western Europe, for example). An existing database stays where it
      # is; a new one goes to the first region in the list that accepts it: the UK first, then the EEA
      # and Switzerland, which UK GDPR treats as adequate.
      - name: Terraform apply
        env:
          SQL_REGIONS: >-
            ${{ inputs.sql_location }} ${{ vars.SQL_LOCATION }} ${{ vars.AZURE_LOCATION }} ukwest
            northeurope westeurope francecentral germanywestcentral swedencentral norwayeast
            polandcentral italynorth spaincentral switzerlandnorth
        run: |
          CURRENT=$(terraform state show -no-color azurerm_mssql_server.main 2>/dev/null \
            | awk -F'"' '/^ *location *=/ { print $2; exit }' || true)
          TRIED=" "
          for region in ${CURRENT:-$SQL_REGIONS}; do
            case "$TRIED" in *" $region "*) continue ;; esac
            TRIED="$TRIED$region "
            # For the log: what Azure SQL's capabilities API says about this subscription and region.
            CAPABILITY=$(az rest --method get --query "join(' ', [status, reason || ''])" -o tsv \
              --url "https://management.azure.com/subscriptions/$ARM_SUBSCRIPTION_ID/providers/Microsoft.Sql/locations/$region/capabilities?api-version=2021-11-01" \
              2>/dev/null || true)
            echo "Azure SQL in $region: ${CAPABILITY:-no answer}"
            echo "::group::terraform apply with the database in $region"
            if terraform apply -auto-approve -var="image_tag=$COMMIT" -var="sql_location=$region" 2>&1 | tee apply.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -qE "ProvisioningDisabled|restricted from provisioning|not accepting creation|RegionDoesNotAllowProvisioning|RequestDisallowedByAzure|not accepting new customers" apply.log; then
              grep -A20 "Error:" apply.log || true
              exit 1
            fi
            echo "::warning::Azure SQL does not accept new servers from this subscription in $region. Trying the next region."
          done
          echo "::error::No region in the list accepted a new Azure SQL server from this subscription. See docs/runbook.md, 'Database region'."
          exit 1

      - name: Read outputs
        id: outputs
        run: |
          APP_URL=$(terraform output -raw app_url)
          JOB=$(terraform output -raw migrate_job_name)
          WORKSPACE=$(terraform output -raw log_analytics_workspace_id)
          {
            echo "app_url=$APP_URL"
            echo "migrate_job=$JOB"
            echo "log_workspace=$WORKSPACE"
          } >> "$GITHUB_OUTPUT"

      # Right after a deploy changes the database admin, Azure can take a minute to apply it, so a
      # failed migration runs once more. Each failure prints the job's own output from Log Analytics.
      - name: Run database migrations
        env:
          JOB: ${{ steps.outputs.outputs.migrate_job }}
          WORKSPACE: ${{ steps.outputs.outputs.log_workspace }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          job_output() {
            # Console output reaches Log Analytics a few minutes after the job writes it.
            local query="ContainerAppConsoleLogs_CL | where TimeGenerated > ago(1h) | where * has '$1'
              | extend line = column_ifexists('Log_s', '') | order by TimeGenerated asc | project TimeGenerated, line"
            local rows=""
            for _ in $(seq 1 12); do
              if rows=$(az rest --method post --resource https://api.loganalytics.io \
                --url "https://api.loganalytics.io/v1/workspaces/$WORKSPACE/query" \
                --body "$(jq -cn --arg q "$query" '{query: $q}')" --query "tables[0].rows" -o tsv 2>&1) \
                && [ -n "$rows" ]; then
                break
              fi
              sleep 20
            done
            echo "::group::Output of $1"
            echo "${rows:-Nothing reached Log Analytics within four minutes.}"
            echo "::endgroup::"
          }
          for attempt in 1 2; do
            EXECUTION=$(az containerapp job start -n "$JOB" -g "$APP_RG" --query name -o tsv)
            echo "Started $EXECUTION"
            STATUS=""
            for _ in $(seq 1 60); do
              STATUS=$(az containerapp job execution show -n "$JOB" -g "$APP_RG" --job-execution-name "$EXECUTION" \
                --query properties.status -o tsv)
              echo "migration: $STATUS"
              case "$STATUS" in Succeeded | Failed | Stopped | Degraded) break ;; esac
              sleep 15
            done
            if [ "$STATUS" = Succeeded ]; then exit 0; fi
            job_output "$EXECUTION"
            if [ "$attempt" = 1 ]; then
              echo "Running the migration once more in a minute"
              sleep 60
            fi
          done
          echo "::error::The migration job failed twice. Its output is above; see also docs/runbook.md, 'Migration job failed'."
          exit 1

      - name: Smoke test
        env:
          APP_URL: ${{ steps.outputs.outputs.app_url }}
        run: |
          # The app scales to zero and the free-offer database may be paused, so the first call can be slow.
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 60 "$APP_URL/readyz"; then break; fi
            sleep 10
          done
          curl -fsS --max-time 60 "$APP_URL/readyz"
          curl -fsS --max-time 60 -X POST "$APP_URL/api/v1/triage" -H 'content-type: application/json' \
            -d '{"subject":"Smoke test: printer offline","body":"Deploy check. The printer on floor 2 says offline."}' \
            | python3 -c "import json, sys; d = json.load(sys.stdin); print(d['priority'], d['category'], d['url'])"
          echo "### Deployed $COMMIT to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
