# Local stack: the app plus SQL Server 2022, the same engine family as Azure SQL.
#   cp .env.example .env   # then set MSSQL_SA_PASSWORD
#   docker compose up --build
# Open http://localhost:8000
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"IF DB_ID('triage') IS NULL CREATE DATABASE triage\" -b"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TRIAGE_ENV: dev
      TRIAGE_DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD}@db:1433/triage?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      TRIAGE_AUTO_MIGRATE: "true"
      TRIAGE_SEED_DEMO: "true"
      TRIAGE_AUTH_MODE: ${TRIAGE_AUTH_MODE:-none}
      TRIAGE_LLM_PROVIDER: ${TRIAGE_LLM_PROVIDER:-stub}
    ports:
      - "127.0.0.1:8000:8000"
