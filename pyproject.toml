[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ticket-triage"
version = "1.0.0"
description = "AI triage for IT service desk tickets: personal data redaction, ML classification, ITIL priority and SLAs, and an optional Azure OpenAI assistant, deployed on Azure with Terraform."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "scikit-learn>=1.5",
  "numpy>=2.0",
  "scipy>=1.13",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "openai>=1.60,<4",
  "azure-identity>=1.19",
  "pyodbc>=5.1",
  "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
train = [
  "pandas>=2.2",
  "matplotlib>=3.9",
]
dev = [
  "ai-ticket-triage[train]",
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage = [
  "web/templates/*.html",
  "web/static/*",
  "kb/articles/*.md",
  "config/*.yaml",
  "db/migrations/*.py",
  "db/migrations/*.mako",
  "db/migrations/versions/*.py",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
  "S101",   # assert is fine in tests and type narrowing
  "RUF001", # we deliberately handle unicode quotes in text normalisation
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 110; long regular expressions and sentences may run a little over.
max-line-length = 125

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018"]
"src/triage/db/migrations/**" = ["E501"]
"src/triage/data/synthetic.py" = ["S311"]  # random is fine for generating synthetic data

[tool.mypy]
python_version = "3.12"
packages = ["triage"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["triage.db.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "mssql: runs against a real SQL Server (set TEST_MSSQL_URL)",
  "quality: model quality gate (trains the model, slower)",
]
filterwarnings = ["ignore::DeprecationWarning:pyodbc"]

[tool.coverage.run]
source = ["triage"]
omit = ["src/triage/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
